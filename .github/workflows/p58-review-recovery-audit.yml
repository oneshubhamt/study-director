name: P5.8 Review recovery checkpoint audit

on:
  push:
    branches: [ts-exp]

permissions:
  contents: read

concurrency:
  group: p58-review-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Strict TypeScript and typed lint
        run: npm run check:types
      - name: Focused lifecycle proof
        run: node tests/helpers/run-category.mjs targeted tests/integration/app/session-lifecycle-module.mjs
      - name: Build
        run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Exact previously blocked sync journey
        run: node tests/browser/backup/sync-journeys.mjs
