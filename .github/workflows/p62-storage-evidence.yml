name: P6.2 storage evidence

on:
  push:
    branches: [ts-exp]
    paths:
      - '.github/workflows/p62-storage-evidence.yml'
      - 'tests/helpers/mutation.mts'
      - 'tests/integration/storage/repository-journals.mjs'
      - 'tests/helpers/repository-harness.mjs'
      - 'tests/helpers/phase-timing.mts'
      - 'tests/integration/backup/repository-checkpoint.mjs'
      - 'tests/helpers/coverage-risk.mts'
      - 'tests/integration/attachments/attachment-deletion.mjs'
      - 'tests/integration/backup/repository-restore.mjs'
      - 'tests/integration/backup/sync-shared-base.mjs'
      - 'tests/browser/exports/exports.mjs'
      - 'tests/browser/storage/storage-failure-recovery.mjs'
      - 'tests/browser/storage/capacity.mjs'
      - 'tests/browser/backup/restore-session-safety.mjs'
      - 'source/core/record-codecs.ts'
      - 'source/core/backup.ts'
      - 'tests/integration/backup/current-canonical-roundtrip.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: restore-publication
            mutants: exact-restore-does-not-owe-publication shared-restore-owes-publication bring-in-owes-publication
          - area: restore-immutability
            mutants: restore-preserves-selected-manifest restore-safety-copy-preserves-displaced-records
          - area: note-readback
            mutants: note-reference-removal-verifies-persisted-text note-reference-removal-verifies-whole-record note-reference-removal-verifies-links
          - area: restore-convergence
            mutants: exact-restore-identifies-selected-checkpoint restore-queues-newer-source-state restore-queues-disconnected-configured-peer
          - area: scheduler-and-pending
            mutants: automatic-cadence-keeps-first-change recovery-holds-every-provider pending-receipt-preserves-successor foreground-release-resumes-work
          - area: recovery-and-ownership
            mutants: recovery-resumes-after-unwind recovery-publication-failure-stays-pending mutation-denies-foreign-writer mutation-rejects-stale-claim-revision device-claim-rejects-stale-head
          - area: recovery-settlement-and-retirement
            mutants: recovery-hold-awaits-provider-drain recovery-release-resumes-every-provider recovery-failure-still-resumes recovery-host-waits-for-settlement retry-clear-failure-preserves-obligation forget-retires-pending-obligation
          - area: stale-intent-and-receipt
            mutants: exact-restore-retires-superseded-intent unavailable-pending-read-fails-closed pending-receipt-requires-source-revision
          - area: journal-durability-and-integrity
            mutants: restore-journal-prepare-is-strict library-journal-prepare-is-strict restore-journal-phase-is-strict library-journal-phase-is-strict library-journal-verifies-chunk-digest restore-journal-retirement-is-strict library-journal-retirement-is-strict library-journal-verifies-plan-signature
          - area: scheduler-deadline-and-intent-order
            mutants: foreground-release-rediscovers-new-work older-backoff-preserves-new-urgent-deadline same-revision-failure-enforces-backoff restore-clears-before-renewing-source-intent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Attribute failures against unchanged controls in disposable copies
        env:
          MUTANTS: ${{ matrix.mutants }}
        run: node tests/helpers/mutation.mjs $MUTANTS
      - name: Verify checkout unchanged
        if: always()
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  export-picker:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Locate Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Five isolated file-picker journeys
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Exports replay $attempt"
            time node tests/browser/exports/exports.mjs
          done

  risk-coverage:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Preserve numeric safety floors after replacing the readback anchor
        run: node tests/helpers/coverage.mjs --json "$RUNNER_TEMP/p62-coverage.json"
      - name: Verify all previously established permanent safety mutants
        run: >-
          node tests/helpers/mutation.mjs
          canonical-sorts-object-keys
          save-lane-retries-only-current-value
          settlement-clears-its-deadline
          diagnostic-history-keeps-live-operations
          partial-integrity-remains-unfinished
          encrypted-backup-password-verifier-is-enforced
          backup-chunk-integrity-is-enforced
          attachment-metadata-failure-rolls-references-back
          restore-verifies-committed-saved-days
          reconciliation-verifies-committed-saved-days
          library-clear-restores-durable-journal
          sync-keeps-the-other-edit
          hourly-keeps-only-changed-notes
          clock-jump-rebases-timer-start

  storage-failure:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Locate Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Five isolated storage failure and recovery journeys
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Storage failure replay $attempt"
            time node tests/browser/storage/storage-failure-recovery.mjs
          done

  running-restore:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run check:types
      - run: node tests/integration/backup/current-canonical-roundtrip.mjs
      - run: npm run build
      - name: Locate Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Running restore and material change controls
        run: |
          for attempt in 1 2 3; do
            echo "Running restore safety replay $attempt"
            time node tests/browser/backup/restore-session-safety.mjs
          done
      - name: Maximum-count restore controls
        run: |
          time node tests/browser/storage/capacity.mjs
          time env SD_CAPACITY_INACTIVE=1 node tests/browser/storage/capacity.mjs

  ownership-restart:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Locate Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Journal takeover and restart
        run: time node tests/browser/backup/recovery-takeover.mjs
      - name: Session plan ownership and stale authority
        run: time node tests/browser/backup/session-plan-sync.mjs
      - name: Cold start Drive recovery
        run: time node tests/browser/backup/cold-start-drive-recovery.mjs

  storage-cost-profile:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Comparable isolated sequential cost samples
        env:
          SD_P62_PROFILE: '1'
        run: |
          node --version
          for attempt in 1 2 3; do
            echo "Storage cost sample $attempt (one job, fresh child per suite)"
            node tests/helpers/run-category.mjs --jobs 1 targeted tests/integration/backup/repository-checkpoint.mjs tests/integration/backup/repository-restore.mjs tests/unit/backup/repository-retention.mjs
          done
