name: REVIEW-P5 temporary pinned runtime regeneration
on:
  push:
    branches: [ts-exp]
    paths:
      - '.github/workflows/review-p5-regenerate.yml'
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Regenerate declared runtime inputs
        run: npm run build:runtime
      - name: Verify regenerated inputs
        run: |
          node tests/architecture/build/rich-text-bundle.mjs
          git diff --stat -- generated/runtime
          test "$(git diff --name-only -- generated/runtime)" = "generated/runtime/rich-text.js"
      - name: Export reproducible rich-text output to connector
        run: |
          git hash-object generated/runtime/rich-text.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const b64=fs.readFileSync('generated/runtime/rich-text.js').toString('base64');
          for(let i=0;i<b64.length;i+=6000) console.log('SD_RUNTIME_CHUNK '+(i/6000)+' '+b64.slice(i,i+6000));
          JS
      - name: Verify corrected contracts
        run: |
          node tests/architecture/app/runtime-boundaries.mjs
          node tests/architecture/storage/background-work-contract.mjs
          node tests/integration/backup/backup-capture-notification.mjs
