name: P5.7 targeted browser closure

on:
  push:
    branches: [ts-exp]

permissions:
  contents: read

concurrency:
  group: p57-targeted-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: P5.7 non-browser closure witnesses
        run: >-
          node tests/helpers/run-category.mjs targeted
          tests/architecture/app/backup-limits-wiring.mjs
          tests/integration/app/storage-reset-connect-recovery.mjs
          tests/integration/storage/repository-integrity-state.mjs
          tests/integration/backup/backup-reminder.mjs
          tests/integration/backup/no-backup-location.mjs
          tests/integration/backup/file-lifetimes.mjs
          tests/integration/backup/encryption.mjs
          tests/integration/backup/folder-encryption.mjs
          tests/integration/backup/device-folder-storage.mjs
          tests/integration/rich-text/reconciliation-ui.mjs
          tests/integration/rich-text/reconciliation-engine.mjs
          tests/integration/backup/import-lifecycle.mjs
          tests/integration/backup/repository-restore.mjs
          tests/integration/backup/restore-assets.mjs
          tests/integration/backup/current-canonical-roundtrip.mjs
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: P5.7 targeted backup/recovery journeys
        run: |
          node tests/browser/backup/encryption.mjs
          node tests/browser/backup/pwa-device-backup.mjs
          node tests/browser/backup/sync-kept-reviews.mjs
          node tests/browser/backup/restore-session-safety.mjs
      - name: Changed P5.7 browser witnesses — five isolated passes
        run: |
          for pass in 1 2 3 4 5; do
            echo "P5.7 changed browser witness pass $pass/5"
            node tests/browser/backup/sync-kept-reviews.mjs
            node tests/browser/backup/complete-library.mjs
            node tests/browser/security/runtime-boundary.mjs
          done
