name: Temporary Targeted Browser Certification

on:
  push:
    branches: [current-fixes]

permissions:
  contents: read

concurrency:
  group: temporary-targeted-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Install npm 12.2.1
        run: npm install -g npm@12.2.1
      - name: Install release toolchain
        run: npm ci --ignore-scripts
      - name: Build release
        run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Run targeted functional browser cases serially
        run: |
          node tests/browser/library/notes-management.mjs
          node tests/browser/backup/session-plan-sync.mjs
