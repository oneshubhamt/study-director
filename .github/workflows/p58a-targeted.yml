name: P5.8A targeted Drive closure

on:
  push:
    branches: [ts-exp]

permissions:
  contents: read

concurrency:
  group: p58a-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Strict TypeScript and typed lint
        run: npm run check:types
      - name: P5.8A Drive and provider witnesses
        run: >-
          node tests/helpers/run-category.mjs targeted
          tests/integration/backup/drive-security.mjs
          tests/integration/backup/drive-profile-binding.mjs
          tests/integration/backup/drive-repository-scale.mjs
          tests/unit/backup/repository-background.mjs
          tests/integration/backup/repository-checkpoint.mjs
      - name: Source build
        run: node build/build.mjs
      - name: Verify generated build
        run: node build/verify-build.mjs
      - name: Verify generated syntax
        run: node tests/architecture/build/generated-syntax-check.mjs
