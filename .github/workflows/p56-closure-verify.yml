name: P5.6 closure verification

on:
  push:
    branches:
      - ts-exp

permissions:
  contents: read

concurrency:
  group: p56-closure-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Use pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: P5.6 targeted witnesses
        run: >-
          node tests/helpers/run-category.mjs targeted
          tests/integration/search/search-client-lifetime.mjs
          tests/architecture/app/workspace-contracts.mjs
          tests/integration/storage/note-persistence.mjs
          tests/integration/storage/note-text-checked-once.mjs
          tests/integration/library/library-clear.mjs
          tests/integration/storage/pending-reviews.mjs
          tests/integration/ui/application-outcomes.mjs
          tests/unit/exports/note-export.mjs
          tests/integration/attachments/pdf-reader-lifetime.mjs
          tests/integration/attachments/attachment-library-lifecycle.mjs
          tests/integration/attachments/rich-attachment-api.mjs
          tests/integration/rich-text/attachment-busy-lifecycle.mjs
          tests/integration/attachments/document-host-lifecycle.mjs
          tests/architecture/app/runtime-boundaries.mjs
      - name: Complete fast suite
        run: node tests/helpers/run-category.mjs fast
      - name: Coverage-risk validation
        run: node tests/helpers/coverage.mjs
