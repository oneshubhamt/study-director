name: REVIEW-P5 Stage 1 audit

on:
  push:
    branches: [ts-exp]
    paths:
      - 'source/**'
      - 'types/**'
      - 'tests/**'
      - 'build/**'
      - 'portable/**'
      - 'rich-text/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/review-p5-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-p5-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-fast:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Strict TypeScript and typed lint
        run: npm run check:types
      - name: Negative type and vendor declaration gates
        run: npm run test:release:types
      - name: Complete fast correctness suite
        run: npm run test:fast
      - name: Authored syntax
        if: ${{ !cancelled() }}
        run: npm run test:release:syntax
      - name: Dependency assurance
        if: ${{ !cancelled() }}
        run: npm run test:release:dependencies
      - name: Source build and generated verification
        if: ${{ !cancelled() }}
        run: |
          npm run build
          npm run verify
          npm run test:release:generated-syntax
      - name: Deployment contract
        if: ${{ !cancelled() }}
        run: npm run test:release:deployment
      - name: Minified deployment verification (no deployment)
        if: ${{ !cancelled() }}
        run: |
          npm run stage:firebase:minified
          npm run test:release:minified
      - name: Historical runtime function reconciliation inventory
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {parse,tokenizer} from 'acorn';
          import {eraseTypes} from './build/source-script.mts';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:64*1024*1024});
          const base='de4872a88c2015bc8833e0244c0ab8ce6e6b5998';
          const generated=new Set(['rich-text.js','wordgard.js','search-worker.js','export-worker.js','image-worker.js','attachment-worker.js']);
          const paths=ref=>git('ls-tree','-r','--name-only',ref,'source').trim().split('\n')
            .filter(path=>/\.(js|ts)$/.test(path)&&!generated.has(path.split('/').at(-1)));
          const tokenHash=source=>{
            const tokens=Array.from(tokenizer(source,{ecmaVersion:'latest',sourceType:'module'}),token=>[token.type.label,token.value]);
            return createHash('sha256').update(JSON.stringify(tokens,(_key,value)=>typeof value==='bigint'?String(value)+'n':value)).digest('hex');
          };
          function inventory(ref){
            const rows=[],files=paths(ref);
            for(const path of files){
              // Preserve template identities and positions while making bare build tokens legal JS.
              const raw=git('show',ref+':'+path).replace(/@@SD_[A-Z0-9_]+@@/g,token=>token.replaceAll('@','$'));
              const source=eraseTypes(raw,path);
              let ast;
              try{ast=parse(source,{ecmaVersion:'latest',sourceType:'module',locations:true});}
              catch(error){throw new Error(`Cannot inventory ${ref}:${path}: ${error.message}`,{cause:error});}
              const visit=(node,parent=null)=>{
                if(!node||typeof node.type!=='string')return;
                if(['FunctionDeclaration','FunctionExpression','ArrowFunctionExpression'].includes(node.type)){
                  const name=node.id?.name||(parent?.type==='VariableDeclarator'?parent.id?.name:null)||(parent?.type==='Property'||parent?.type==='MethodDefinition'?parent.key?.name||parent.key?.value:null);
                  if(typeof name==='string'&&name)rows.push({path,name,line:node.loc.start.line,hash:tokenHash(source.slice(node.start,node.end))});
                }
                for(const value of Object.values(node)){
                  if(Array.isArray(value)){for(const child of value)visit(child,node);}
                  else if(value&&typeof value==='object'&&typeof value.type==='string')visit(value,node);
                }
              };
              visit(ast);
            }
            return {files,rows};
          }
          const old=inventory(base),current=inventory('HEAD');
          const index=(rows,key)=>{const map=new Map();for(const row of rows){const k=key(row),list=map.get(k)||[];list.push(row);map.set(k,list);}return map;};
          const compare=(from,to,direction)=>{
            const hashes=index(to.rows,row=>row.hash),names=index(to.rows,row=>row.name);
            let identical=0,relocated=0,changed=0,unmatched=0;
            const summary={};
            for(const row of from.rows){
              const key=row.path,counts=summary[key]??={identical:0,relocated:0,changed:0,unmatched:0};
              const exact=hashes.get(row.hash)||[],named=names.get(row.name)||[];
              const kind=exact.some(other=>other.path.replace(/\.ts$/,'.js')===row.path.replace(/\.ts$/,'.js')&&other.name===row.name)?'identical':exact.length?'relocated':named.length?'changed':'unmatched';
              counts[kind]++;
              if(kind==='identical')identical++;else if(kind==='relocated')relocated++;else if(kind==='changed')changed++;else unmatched++;
              if(kind==='changed'||kind==='unmatched')console.log(JSON.stringify({direction,kind,path:row.path,line:row.line,name:row.name,candidates:named.map(other=>other.path+':'+other.line)}));
            }
            console.log(JSON.stringify({direction,files:from.files.length,functions:from.rows.length,identical,relocated,changed,unmatched,summary}));
          };
          compare(old,current,'baseline-to-current');
          compare(current,old,'current-to-baseline');
          console.log('Function-token inventory only: exact matches are not binding/caller equivalence; changed and unmatched entries require semantic review.');
          JS
  session-browser:
    if: github.ref == 'refs/heads/ts-exp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        file:
          - tests/browser/backup/recovery-takeover.mjs
          - tests/browser/library/note-picker-authority.mjs
          - tests/browser/library/notes-management.mjs
          - tests/browser/attachments/attachments.mjs
          - tests/browser/app/session-draft-edit.mjs
          - tests/browser/plans/saved-plans-ui.mjs
          - tests/browser/backup/session-plan-sync.mjs
          - tests/browser/app/session-merge-timer.mjs
          - tests/browser/backup/restore-session-safety.mjs
          - tests/browser/backup/session-handoff-journeys.mjs
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Locate Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Isolated session transition and recovery journeys
        env:
          TEST_FILE: ${{ matrix.file }}
        run: |
          repeats=1
          if [ "$TEST_FILE" = tests/browser/app/session-merge-timer.mjs ] || [ "$TEST_FILE" = tests/browser/backup/recovery-takeover.mjs ]; then repeats=5; fi
          for ((pass=1; pass<=repeats; pass++)); do
            echo "=== $TEST_FILE pass $pass/$repeats ==="
            node "$TEST_FILE"
          done
