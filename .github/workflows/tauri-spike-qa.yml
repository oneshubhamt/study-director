name: Tauri spike QA

on:
  push:
    branches: [tauri-spike]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-spike-qa
  # Preserve a running qualification when a later checkpoint is pushed.
  cancel-in-progress: false

jobs:
  pwa-regression:
    if: github.ref == 'refs/heads/tauri-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Generate PWA assets
        run: node build/build.mjs
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Shared core and PWA regression
        run: |
          node tests/browser/app/core-flow.mjs
          node tests/browser/library/notes-management.mjs
          node tests/browser/pwa/pwa-offline.mjs
          node tests/browser/pwa/pwa-update.mjs
  windows-build:
    if: github.ref == 'refs/heads/tauri-spike'
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Toolchain identity
        run: |
          node --version
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Stage packaged frontend
        run: node build/stage-tauri.mjs
      - name: Verify committed dependency lock
        shell: pwsh
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash src-tauri/Cargo.lock -Algorithm SHA256
      - name: Rust unit tests (packaged origin)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol --all-targets -- -D warnings
      - name: Build experimental Windows executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
      - name: Identify exact executable
        id: digest
        shell: pwsh
        run: |
          $hash = (Get-FileHash src-tauri/target/release/study-director-tauri-spike.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output $hash
      - name: Stage unqualified build for independent QA samples
        uses: actions/upload-artifact@v4
        with:
          name: tauri-qa-input-${{ github.sha }}
          path: src-tauri/target/release/study-director-tauri-spike.exe
          if-no-files-found: error
          retention-days: 1
  windows-smoke:
    needs: windows-build
    if: github.ref == 'refs/heads/tauri-spike'
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: tauri-qa-input-${{ github.sha }}
          path: src-tauri/target/release
      - name: Packaged WebView2 sample ${{ matrix.sample }}
        env:
          SD_TAURI_BUILD_SHA256: ${{ needs.windows-build.outputs.sha256 }}
        run: node tests/helpers/tauri-smoke.mjs
  qualified-artifact:
    needs: [windows-build, windows-smoke, pwa-regression]
    if: github.ref == 'refs/heads/tauri-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tauri-qa-input-${{ github.sha }}
          path: qa-exe
      - name: Verify qualified executable digest
        env:
          SD_TAURI_BUILD_SHA256: ${{ needs.windows-build.outputs.sha256 }}
        run: echo "$SD_TAURI_BUILD_SHA256  qa-exe/study-director-tauri-spike.exe" | sha256sum --check
      - name: Preserve smoke-tested experimental executable
        uses: actions/upload-artifact@v4
        with:
          name: tauri-spike-smoke-tested-exe-${{ github.sha }}
          path: qa-exe/study-director-tauri-spike.exe
          if-no-files-found: error
          retention-days: 7
