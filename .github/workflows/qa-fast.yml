name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - name: Bug regression policy
        if: github.event_name == 'pull_request'
        run: node tests/helpers/bug-regression-policy.mjs
      - name: Targeted safety and repository contracts
        run: >-
          node tests/helpers/run-category.mjs targeted
          tests/integration/storage/background-gc-reliability.mjs
          tests/integration/library/library-clear.mjs
          tests/integration/backup/capture-safety.mjs
          tests/unit/app/operation-lifecycle.mjs
          tests/unit/backup/repository-background.mjs
          tests/integration/storage/data-maintenance.mjs
          tests/integration/storage/deletion-recovery.mjs
          tests/integration/backup/device-backup.mjs
          tests/integration/backup/repository-checkpoint.mjs
          tests/integration/backup/drive-security.mjs
          tests/integration/storage/attachment-integrity-audit.mjs
          tests/integration/storage/integrity-continuation.mjs
          tests/integration/exports/scratch-gc.mjs
          tests/architecture/storage/background-work-contract.mjs
          tests/architecture/storage/managed-recovery-contract.mjs
          tests/integration/pwa/service-worker-lifecycle.mjs
          tests/architecture/test-suite/suite-governance.mjs
          tests/architecture/test-suite/suite-structure.mjs
          tests/architecture/test-suite/suite-policy.mjs
      - name: PWA deployment contract
        run: node tests/architecture/build/deployment-contract.mjs
      - name: Source build
        run: node build/build.mjs
      - name: Verify generated build
        run: node build/verify-build.mjs
      - name: Verify generated syntax
        run: node tests/architecture/build/generated-syntax-check.mjs
