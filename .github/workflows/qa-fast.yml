name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Bug regression policy
        if: github.event_name == 'pull_request'
        run: node tests/helpers/bug-regression-policy.mjs
      # The whole fast suite (unit, integration, architecture) runs in about a
      # minute, so every push checks all of it rather than a chosen subset.
      - name: Fast suite
        run: node tests/helpers/run-category.mjs fast
      - name: PWA deployment contract
        run: node tests/architecture/build/deployment-contract.mjs
      - name: Source build
        run: node build/build.mjs
      - name: Verify generated build
        run: node build/verify-build.mjs
      - name: Verify generated syntax
        run: node tests/architecture/build/generated-syntax-check.mjs
